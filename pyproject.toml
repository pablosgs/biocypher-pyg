[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "biocypher-pyg"
version = "0.1.0.dev0"
description = "Convert biomedical knowledge graph records into PyTorch Geometric HeteroData."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "UNLICENSED - choose a license before public release" }
authors = [{ name = "Project contributors" }]
dependencies = [
  "torch>=2.2",
  "torch-geometric>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]
biocypher = ["biocypher"]
examples = ["pandas>=2"]

[tool.hatch.build.targets.wheel]
packages = ["src/biocypher_pyg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
